<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelGo</title>
  <link rel="stylesheet" href="style.css" />
  
</head>
<body>
  <header>
    <h1>🌍 TravelGo</h1>
    <p>Upload and share your travel memories</p>
  </header>

  <main>
    <section class="upload-card">
      <h2>Upload Travel Media</h2>

<input type="file" id="file" accept="image/*,video/*" required />
<input type="text" id="userId" placeholder="userId" required />
<input type="text" id="description" placeholder="Description" required />
<input type="text" id="destination" placeholder="Destination" required />

      <button onclick="uploadMedia()">Upload</button>
    </section>

    <section>
      <div class="section-title">
        <h2>Your Posts</h2>
        <button onclick="loadMedia()">Refresh</button>
      </div>

      <div id="mediaList" class="grid"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
